name: Mirror to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee mirror
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN:    ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_USERNAME" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "WARN: GITEE_USERNAME or GITEE_TOKEN not set in GitHub Secrets."
            echo "WARN: Skip mirror push. Please add them in: Settings → Secrets → Actions"
            exit 0
          fi
          git remote add gitee "https://$GITEE_USERNAME:$GITEE_TOKEN@gitee.com/$GITEE_USERNAME/hot-search-data.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force gitee main
          echo "OK: mirrored to https://gitee.com/$GITEE_USERNAME/hot-search-data"
