name: 抓取热搜数据

# 触发条件：
#   - 白天 8-22 点（UTC 0-14）每小时整点触发一次
#   - 夜间 0 点、4 点（UTC 16、20）触发一次，降低频率省额度
#   - 支持手动触发
on:
  schedule:
    - cron: '0 0-14 * * *'
    - cron: '0 16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-hot-search
  cancel-in-progress: false

env:
  FRESHNESS_THRESHOLD_HOURS: 3

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取数据
        id: fetch
        run: node fetcher/fetch.js

      - name: 数据新鲜度检查 + 报告
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('data/_meta.json', 'utf8'));
          const now = Date.now();
          const threshold = ${FRESHNESS_THRESHOLD_HOURS} * 3600 * 1000;
          const problems = [];
          let okCount = 0;
          for (const p of meta.platforms) {
            if (p.count === 0) {
              problems.push('🟡 ' + p.key + ': 无数据');
              continue;
            }
            const age = (now - new Date(p.update_time).getTime()) / 3600000;
            if (age > ${FRESHNESS_THRESHOLD_HOURS}) {
              problems.push('🔴 ' + p.key + ': 过期 ' + age.toFixed(1) + 'h');
            } else {
              okCount++;
              console.log('✅ ' + p.key + ': ' + p.count + ' 条 (' + age.toFixed(1) + 'h)');
            }
          }
          console.log('\\n✅ 正常:', okCount + '/' + meta.platforms.length);
          if (problems.length) {
            console.log('\\n⚠️ 问题:');
            problems.forEach(p => console.log('  ' + p));
          }
          "

      - name: 提交到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore(data): 更新热搜数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi