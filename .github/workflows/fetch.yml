name: 抓取热搜数据

# 触发条件：
#   - 白天 8-22 点（UTC 0-14）每小时整点触发一次
#   - 夜间 0 点、4 点（UTC 16、20）触发一次，降低频率省额度
#   - 支持手动触发
#   - 推送到 main 时不触发，避免循环
on:
  schedule:
    - cron: '0 0-14 * * *'    # UTC 0-14 = 北京 8-22 点，每小时
    - cron: '0 16,20 * * *'   # UTC 16,20 = 北京 0,4 点
  workflow_dispatch:

permissions:
  contents: write    # 允许 commit 回仓库

concurrency:
  group: fetch-hot-search
  cancel-in-progress: false    # 不打断正在运行的抓取

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取数据
        run: node fetcher/fetch.js

      - name: 提交到仓库（github-actions[bot] 身份）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore(data): 更新热搜数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 报告状态
        if: always()
        run: |
          echo "=== 抓取完成 ==="
          echo "时间: $(date)"
          if [ -f data/_meta.json ]; then
            cat data/_meta.json
          fi
