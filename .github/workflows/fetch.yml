name: Fetch Hot Search Data

on:
  schedule:
    # UTC 0-14 = Beijing 8-22, every hour on the hour
    - cron: '0 0-14 * * *'
    # UTC 16,20 = Beijing 0,4 (night, low frequency)
    - cron: '0 16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-hot-search
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (axios + cheerio)
        run: npm install axios cheerio

      - name: Fetch hot search data
        run: node fetcher/fetch.js

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ -A 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "chore(data): update hot search data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Report summary
        if: always()
        run: |
          echo "=== Run Summary ==="
          echo "UTC Time: $(date -u)"
          echo "Beijing : $(TZ='Asia/Shanghai' date)"
          if [ -f data/_meta.json ]; then
            echo "--- Meta ---"
            cat data/_meta.json
          else
            echo "No _meta.json yet"
          fi
